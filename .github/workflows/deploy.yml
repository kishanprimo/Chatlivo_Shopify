name: Deploy to production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    env:
      # The Shopify config deploy (webhooks, scopes, theme embed) runs only
      # once the SHOPIFY_CLI_PARTNERS_TOKEN repository secret is added
      HAS_SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @whatwg-node/fetch needs Node >= 22.15 and .npmrc has engine-strict
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail here, before the server is touched, if the app doesn't compile
      - name: Type-check and build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Deploy entire project
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --delete removes server files missing from the repo, so server-only
          # files (.env with secrets, backups) must be excluded or they get wiped
          switches: -avzr --delete --exclude=node_modules --exclude=.git --exclude=.env --exclude='.env.*' --exclude=build --exclude=dev.sqlite --exclude=logs
          path: ./
          remote_path: /var/www/shopify.chatlivo.com
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: 22
          legacy_allow_rsa_hostkeys: true

      - name: Build and Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          CHATLIVO_BACKEND_URL: ${{ secrets.CHATLIVO_BACKEND_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: SHOPIFY_APP_URL,SHOPIFY_API_KEY,SHOPIFY_API_SECRET,CHATLIVO_BACKEND_URL
          script: |
            # Stop on the first failure: a failed build must never restart
            # pm2 without build/server/index.js
            set -e
            cd /var/www/shopify.chatlivo.com

            echo "📦 Installing dependencies..."
            npm install

            echo "🗄️  Setting up database..."
            npm run setup

            echo "🔨 Building application..."
            npm run build

            echo "🛑 Stopping existing PM2 process..."
            pm2 stop shopify-chatlivo 2>/dev/null || true
            pm2 delete shopify-chatlivo 2>/dev/null || true

            echo "▶️  Starting application with PM2..."
            SHOPIFY_APP_URL="${SHOPIFY_APP_URL}" \
            SHOPIFY_API_KEY="${SHOPIFY_API_KEY}" \
            SHOPIFY_API_SECRET="${SHOPIFY_API_SECRET}" \
            CHATLIVO_BACKEND_URL="${CHATLIVO_BACKEND_URL}" \
            pm2 start ecosystem.config.cjs

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo ""
            echo "✅ Deployment complete!"
            echo ""
            pm2 status
            echo ""
            echo "📊 View logs: pm2 logs shopify-chatlivo"

      # Pushes shopify.app.primocys.toml (webhook subscriptions, scopes) and the theme
      # app embed to Shopify, after the server already serves the new routes
      - name: Deploy Shopify app configuration
        if: env.HAS_SHOPIFY_TOKEN == 'true'
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
        run: npx --yes @shopify/cli@4.9.4 app deploy --config shopify.app.primocys.toml --allow-updates --message "${{ github.sha }}"
