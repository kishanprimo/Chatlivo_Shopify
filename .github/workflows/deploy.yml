name: Deploy to production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy entire project
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=node_modules --exclude=.git --exclude=.env.local --exclude=build
          path: ./
          remote_path: /var/www/shopify.chatlivo.com
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: 22
          legacy_allow_rsa_hostkeys: true

      - name: Build and Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/shopify.chatlivo.com

            echo "📦 Installing dependencies..."
            npm install

            echo "🗄️  Setting up database..."
            npm run setup

            echo "🔨 Building application..."
            npm run build

            echo "🛑 Stopping existing PM2 process..."
            pm2 stop shopify-chatlivo || true

            echo "▶️  Starting application with PM2..."
            pm2 start ecosystem.config.js --update-env

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo ""
            echo "✅ Deployment complete!"
            echo ""
            pm2 status
            echo ""
            echo "📊 View logs: pm2 logs shopify-chatlivo"
