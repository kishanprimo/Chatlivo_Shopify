# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "26949b2c72812ece1834683cf57b9917"
name = "Chatlivo"
application_url = "https://shopify.chatlivo.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[auth]
redirect_urls = [ "https://shopify.chatlivo.com/auth/callback" ]
